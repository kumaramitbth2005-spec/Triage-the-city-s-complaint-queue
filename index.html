<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Smart City — Municipal operator dashboard for AI-assisted complaint routing and resolution." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@400;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json" />
    <title>Smart City | AI Municipal Complaint Triage Platform</title>

    <!-- Google Identity Services (for "Continue with Google") -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Facebook JS SDK (for "Continue with Facebook") -->
    <script>
      window.fbAsyncInit = function() {
        const fbAppId = document.getElementById('fb-app-id-meta')?.content;
        if (fbAppId && fbAppId !== 'your_facebook_app_id_here') {
          FB.init({
            appId: fbAppId,
            cookie: true,
            xfbml: true,
            version: 'v20.0'
          });
        }
      };
      (function(d, s, id) {
        var js, fjs = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) return;
        js = d.createElement(s); js.id = id;
        js.src = 'https://connect.facebook.net/en_US/sdk.js';
        fjs.parentNode.insertBefore(js, fjs);
      }(document, 'script', 'facebook-jssdk'));
    </script>
  </head>
  <body>
    <!-- Facebook App ID passed to FB SDK via meta tag (set by Vite env) -->
    <meta id="fb-app-id-meta" content="%VITE_FACEBOOK_APP_ID%" />
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Clear legacy service worker caches so updates appear immediately
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var registration of registrations) {
            registration.unregister();
          }
        });
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(key) { caches.delete(key); });
          });
        }
      }
    </script>
  </body>
</html>
